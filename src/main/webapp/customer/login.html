<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login — Vehicle Verification System</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="auth-logo-icon" onclick="window.location.href='../index.html'">🛡️</span>
                <h1>Secure Login</h1>
                <p>Enter your credentials to access the portal</p>
            </div>

            <div id="authError" class="auth-error"></div>

            <form id="loginForm" onsubmit="return handleLogin(event)" autocomplete="off">
                <!-- Hidden inputs to trick the browser's autofill -->
                <input type="text" name="prevent_autofill" style="display:none;" />
                <input type="password" name="password_fake" style="display:none;" />
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="off">
                        <span class="input-icon">📧</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="off">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>
                
                <div class="auth-links" style="margin-bottom: var(--space-4);">
                    <a href="#" onclick="showForgotPassword()" style="color: var(--primary-400); font-weight: 600;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
            </form>

            <div class="auth-footer">
                <div>New to the platform? <a href="register.html">Create an Account</a></div>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal-backdrop" id="forgotModal">
        <div class="modal" style="border-radius: 24px; padding: 40px; background: #1e293b; border: 1px solid rgba(255,255,255,0.1);">
            <div class="modal-header">
                <h3 class="modal-title">Reset Password</h3>
                <button class="modal-close" onclick="closeModal('forgotModal')">&times;</button>
            </div>
            <p style="color: #94a3b8; margin-bottom: 24px; line-height: 1.6;">
                We'll send a secure link to your email to reset your password.
            </p>
            <div class="form-group">
                <label>Recovery Email</label>
                <input type="email" id="resetEmail" class="form-control" placeholder="name@company.com" style="background: rgba(0,0,0,0.2); border-radius: 12px; height: 50px;">
            </div>
            <button class="btn btn-primary" onclick="handleForgotPassword()" style="width:100%; height: 50px; border-radius: 12px; margin-top: 16px;">Send Recovery Link</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('authError');
            errEl.classList.remove('visible');

            if (!validateEmail(email)) {
                errEl.textContent = 'Invalid email format.';
                errEl.classList.add('visible');
                return false;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.classList.add('shimmer');
            btn.innerHTML = '<span style="display:inline-block;animation:pulse 1.5s infinite;">Signing in...</span>';

            try {
                await loginUser(email, password);
            } catch (error) {
                errEl.textContent = getAuthErrorMessage(error);
                errEl.classList.add('visible');
                btn.disabled = false;
                btn.classList.remove('shimmer');
                btn.textContent = 'Sign In to Dashboard';
            }
        }

        function showForgotPassword() { openModal('forgotModal'); }

        async function handleForgotPassword() {
            const email = document.getElementById('resetEmail').value;
            if (!email) { showToast('Please enter an email', 'error'); return; }
            try {
                await forgotPassword(email);
                closeModal('forgotModal');
            } catch (error) {
                showToast(getAuthErrorMessage(error), 'error');
            }
        }
        async function switchPortal(url) {
            await auth.signOut();
            window.location.href = url;
        }

        // Aggressively clear fields on load to prevent browser autofill
        window.addEventListener('load', () => {
            setTimeout(() => {
                const e = document.getElementById('email');
                const p = document.getElementById('password');
                if(e) e.value = '';
                if(p) p.value = '';
            }, 50);
        });
    </script>
</body>
</html>
