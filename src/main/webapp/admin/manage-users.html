<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users — Admin</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header" style="cursor:pointer;" onclick="window.location.href='../index.html'" title="Switch Portal"><span class="logo-icon">🛡️</span><h2>Admin Panel</h2></div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Overview</div>
            <a href="admin-dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
            <div class="nav-section-title">Management</div>
            <a href="manage-users.html" class="nav-item active"><span class="nav-icon">👥</span> Manage Users</a>
            <a href="manage-vehicles.html" class="nav-item"><span class="nav-icon">🚗</span> Manage Vehicles</a>
            <a href="reports.html" class="nav-item"><span class="nav-icon">📋</span> Incident Reports</a>
            <a href="blacklist-vehicles.html" class="nav-item"><span class="nav-icon">⛔</span> Blacklist</a>
            <a href="analytics.html" class="nav-item"><span class="nav-icon">📈</span> Analytics</a>
            <div class="nav-section-title">Account</div>
            <a href="#" class="nav-item" onclick="logoutAdmin()"><span class="nav-icon">🚪</span> Logout</a>
        </nav>
    </aside>
    <div class="main-content">
        <header class="top-header">
            <div class="header-left"><button class="menu-toggle" onclick="toggleSidebar()">☰</button><h1 class="page-title">Manage Users</h1></div>
            <div class="header-right"><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️</button></div>
        </header>
        <div class="page-content">
            <div class="search-bar"><input type="text" id="searchInput" class="form-control" placeholder="Search by name or email..." oninput="filterUsers()"></div>
            <div class="card">
                <div class="table-container">
                    <table class="data-table">
                        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead>
                        <tbody id="usersBody"><tr><td colspan="5" class="text-center" style="padding:var(--space-8);color:var(--text-muted);">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Delete Confirm Modal -->
<div class="modal-backdrop" id="deleteModal">
    <div class="modal">
        <div class="modal-header"><h3 class="modal-title">Confirm Delete</h3><button class="modal-close" onclick="closeModal('deleteModal')">&times;</button></div>
        <p style="color:var(--text-secondary);margin-bottom:var(--space-6);">Are you sure you want to delete this user? This action cannot be undone.</p>
        <div style="display:flex;gap:var(--space-3);justify-content:flex-end;">
            <button class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancel</button>
            <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    let allUsers = [];
    let deleteUserId = null;

    (async () => {
        await requireAdmin();
        showLoader();
        try { allUsers = await apiGet('/api/admin/users'); renderUsers(allUsers); } catch(e) {}
        hideLoader();
    })();

    function renderUsers(users) {
        const tbody = document.getElementById('usersBody');
        
        // Filter out ALL users with the 'admin' role
        const filteredUsers = users.filter(u => u.role !== 'admin');
        
        if (!filteredUsers.length) { 
            tbody.innerHTML = '<tr><td colspan="5" class="text-center" style="color:var(--text-muted);">No customer accounts found.</td></tr>'; 
            return; 
        }
        
        tbody.innerHTML = filteredUsers.map(u => `<tr>
            <td><strong>${u.name}</strong></td><td>${u.email}</td>
            <td><span class="badge badge-valid">${u.role}</span></td>
            <td>${formatDate(u.createdAt)}</td>
            <td><button class="btn btn-danger btn-sm" onclick="promptDelete('${u.userId}')">Delete</button></td></tr>`).join('');
    }

    function filterUsers() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        renderUsers(allUsers.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)));
    }

    function promptDelete(uid) { deleteUserId = uid; openModal('deleteModal'); }

    async function confirmDelete() {
        if (!deleteUserId) return;
        showLoader();
        try {
            await apiDelete('/api/admin/users/' + deleteUserId);
            allUsers = allUsers.filter(u => u.userId !== deleteUserId);
            renderUsers(allUsers);
            showToast('User deleted', 'success');
        } catch(e) { showToast(e.message, 'error'); }
        closeModal('deleteModal');
        hideLoader();
    }
</script>
</body>
</html>
